[package]
name = "firstrun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
bytemuck = { version = "1.25.2", features = ["extern_crate_std"] }
camino = "1.2.6"
crossbeam = "0.8.4"
hashbrown = { version = "0.17.1", features = ["serde"] }
nom = "8.0.0"
nt_client = "0.5.1"
num = "0.4.3"
pack1 = { version = "1.1.0", features = ["bytemuck"] }
replace_with = "0.1.8"
rerun = { version = "0.38.1", features = ["native_viewer", "run"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt"] }

[build-dependencies]
re_build_tools = "0.38.1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
