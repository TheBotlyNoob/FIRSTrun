<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FIRSTrun WPI Log Viewer</title>
        <link rel="stylesheet" href="app.css" />
    </head>
    <body>
        <main class="shell">
            <section class="viewer" aria-label="Rerun viewer">
                <label class="upload">
                    <span>Open .wpilog</span>
                    <input
                        id="file-input"
                        type="file"
                        accept=".wpilog,application/octet-stream"
                    />
                </label>
                <canvas id="rerun-canvas"></canvas>
            </section>
        </main>
        <script type="module" src="app.js"></script>
    </body>
</html>
